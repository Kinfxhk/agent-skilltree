# agent-skilltree MVP · pin dsh@0.2.1-rc.5
# points: human/operator only; agent cannot grant points or mutate tree_state
meta:
  schema: agent-skilltree/v0
  host_pin: "@deepseek-ai/dsh@0.2.1-rc.5"
  public_name: agent-skilltree
  constitution: immutable

tabs: [perception, execution, governance]

compiler_targets:
  tools_pre_execute: allow|deny|ask
  tools_guard: true
  tools_restrict: true
  max_parallel_tool_calls: from_unlock
  agent_turn_stopping: from_loop_budget
  subagents_max_depth: from_unlock
  subagents_max_active: from_unlock
  approval_policy: from_consent_nodes
  sandbox_mode: from_execution_tier
  system_prompt_budget: from_soul_nodes
  product_gateway: off|on_demand|persistent
  nsfw_gate: product_layer
  os_path_hygiene: from_unlock
  shell_dialect: from_unlock

nodes:
  # ——— Perception 10 ———
  - id: perception.vision.1
    tab: perception
    name_zh: 視覺 I
    name_en: Vision I
    rank: 1
    cost: 1
    requires: []
    grants: [attachments.images.read_basic]
  - id: perception.vision.2
    tab: perception
    name_zh: 視覺 II
    name_en: Vision II
    rank: 2
    cost: 2
    requires: [perception.vision.1]
    grants: [attachments.images.multi]
  - id: perception.vision.3
    tab: perception
    name_zh: 視覺 III（Capstone）
    name_en: Vision III (Capstone)
    rank: 3
    cost: 3
    requires: [perception.vision.2]
    grants: [attachments.images.advanced]
    capstone: true

  - id: perception.search.1
    tab: perception
    name_zh: 搜尋 I
    name_en: Search I
    rank: 1
    cost: 1
    requires: []
    grants: [tools.web_search]
  - id: perception.search.2
    tab: perception
    name_zh: 搜尋 II
    name_en: Search II
    rank: 2
    cost: 2
    requires: [perception.search.1]
    grants: [tools.web_fetch]
  - id: perception.research.1
    tab: perception
    name_zh: 調研 I
    name_en: Research I
    rank: 1
    cost: 2
    requires: [perception.search.2]
    grants: [tools.multi_search_policy]

  - id: perception.memory.1
    tab: perception
    name_zh: 記憶讀取
    name_en: Memory Read
    rank: 1
    cost: 1
    requires: []
    grants: [memory.read]
  - id: perception.memory.2
    tab: perception
    name_zh: 記憶寫入
    name_en: Memory Write
    rank: 2
    cost: 2
    requires: [perception.memory.1, gov.consent.write]
    grants: [memory.write]
    danger: medium

  - id: perception.files.1
    tab: perception
    name_zh: 檔案讀取
    name_en: Files Read
    rank: 1
    cost: 1
    requires: []
    grants: [tools.fs_read]
  - id: perception.files.2
    tab: perception
    name_zh: 檔案寫入
    name_en: Files Write
    rank: 2
    cost: 2
    requires: [perception.files.1, gov.consent.write]
    grants: [tools.fs_write]
    danger: medium

  # ——— Execution 14 + OS 2 ———
  - id: execution.tools.whitelist
    tab: execution
    name_zh: 工具白名單
    name_en: Tool Whitelist
    rank: 1
    cost: 1
    requires: []
    grants: [tools.restrict.baseline_allow]
  - id: execution.tools.extended
    tab: execution
    name_zh: 工具擴展
    name_en: Tool Extended
    rank: 2
    cost: 2
    requires: [execution.tools.whitelist]
    grants: [tools.restrict.extended_allow]

  - id: execution.call_budget.1
    tab: execution
    name_zh: 呼叫預算 I
    name_en: Call Budget I
    rank: 1
    cost: 1
    requires: [execution.tools.whitelist]
    grants: [loop.max_parallel=2, product.call_count_cap=low]
  - id: execution.call_budget.2
    tab: execution
    name_zh: 呼叫預算 II
    name_en: Call Budget II
    rank: 2
    cost: 2
    requires: [execution.call_budget.1]
    grants: [loop.max_parallel=4, product.call_count_cap=mid]

  - id: execution.loop_budget.1
    tab: execution
    name_zh: 迴圈預算 I
    name_en: Loop Budget I
    rank: 1
    cost: 1
    requires: [execution.tools.whitelist]
    grants: [product.turn_cap=low, turn_stopping.enabled]
  - id: execution.loop_budget.2
    tab: execution
    name_zh: 迴圈預算 II
    name_en: Loop Budget II
    rank: 2
    cost: 2
    requires: [execution.loop_budget.1]
    grants: [product.turn_cap=mid]

  - id: execution.subagent.summon
    tab: execution
    name_zh: 召喚子代理
    name_en: Subagent Summon
    rank: 1
    cost: 2
    requires: [execution.loop_budget.1, execution.tools.whitelist]
    grants: [subagents.max_depth=1, subagents.max_active=1]
  - id: execution.subagent.squad
    tab: execution
    name_zh: 小隊
    name_en: Subagent Squad
    rank: 2
    cost: 3
    requires: [execution.subagent.summon, execution.loop_budget.2, gov.safety.1]
    grants: [subagents.max_depth=2, subagents.max_active=3]
    danger: medium

  - id: execution.parallel.1
    tab: execution
    name_zh: 並行 I
    name_en: Parallel I
    rank: 1
    cost: 1
    requires: [execution.call_budget.1]
    grants: [product.parallel_tasks=2]
  - id: execution.parallel.2
    tab: execution
    name_zh: 並行 II
    name_en: Parallel II
    rank: 2
    cost: 2
    requires: [execution.parallel.1, execution.call_budget.2]
    grants: [product.parallel_tasks=4]

  - id: execution.shell.1
    tab: execution
    name_zh: Shell I
    name_en: Shell I
    rank: 1
    cost: 2
    requires: [execution.tools.whitelist, gov.consent.shell]
    grants: [tools.bash.ask]
    danger: high

  - id: execution.network.1
    tab: execution
    name_zh: 出站網絡 I
    name_en: Outbound Network I
    rank: 1
    cost: 2
    requires: [perception.search.1, gov.consent.network]
    grants: [tools.outbound.ask]
    danger: medium

  - id: execution.gateway.on_demand
    tab: execution
    name_zh: Gateway · On-Demand
    name_en: Gateway On-Demand
    rank: 1
    cost: 2
    requires: [gov.audit.1, gov.consent.network]
    grants: [product.gateway=on_demand]
    danger: medium
    note: "Product-layer; ≠ dsh-api-gateway"
  - id: execution.gateway.persistent
    tab: execution
    name_zh: Gateway · Persistent
    name_en: Gateway Persistent
    rank: 2
    cost: 4
    requires: [execution.gateway.on_demand, gov.audit.1, gov.safety.1]
    grants: [product.gateway=persistent]
    danger: high

  - id: execution.path_hygiene.1
    tab: execution
    name_zh: 路徑衛生 I
    name_en: Path Hygiene I
    rank: 1
    cost: 1
    requires: [execution.tools.whitelist]
    grants: [product.os_path_hygiene=1, tools.pre_execute.path_check=on]
    danger: low
  - id: execution.shell_dialect.1
    tab: execution
    name_zh: Shell 方言 I
    name_en: Shell Dialect I
    rank: 1
    cost: 1
    requires: [execution.tools.whitelist, gov.consent.shell]
    grants: [product.shell_dialect=1, product.os_tips_table=inject]
    danger: medium

  # ——— Governance 12 + strict_path meta ———
  - id: gov.soul.base
    tab: governance
    name_zh: Soul 基底
    name_en: Soul Base
    rank: 1
    cost: 0
    requires: []
    grants: [persona.base, system_prompt.budget=800]
  - id: gov.soul.exp.1
    tab: governance
    name_zh: Soul 擴容 I
    name_en: Soul Expansion I
    rank: 2
    cost: 1
    requires: [gov.soul.base]
    grants: [system_prompt.budget=1200]
  - id: gov.soul.exp.2
    tab: governance
    name_zh: Soul 擴容 II
    name_en: Soul Expansion II
    rank: 3
    cost: 2
    requires: [gov.soul.exp.1]
    grants: [system_prompt.budget=1600]

  - id: gov.consent.write
    tab: governance
    name_zh: 寫入同意
    name_en: Write Consent
    rank: 1
    cost: 1
    requires: []
    grants: [approval.policy.write=ask]
    danger: medium
  - id: gov.consent.shell
    tab: governance
    name_zh: Shell 同意
    name_en: Shell Consent
    rank: 2
    cost: 2
    requires: [gov.consent.write]
    grants: [approval.policy.shell=ask]
    danger: high
  - id: gov.consent.network
    tab: governance
    name_zh: 網絡同意
    name_en: Network Consent
    rank: 2
    cost: 2
    requires: [gov.consent.write]
    grants: [approval.policy.network=ask]
    danger: medium

  - id: gov.safety.1
    tab: governance
    name_zh: Safety Review I
    name_en: Safety Review I
    rank: 1
    cost: 2
    requires: [gov.consent.write]
    grants: [product.safety_review=1, sandbox.floor=workspace-write]
    danger: medium

  - id: gov.audit.1
    tab: governance
    name_zh: Audit I
    name_en: Audit I
    rank: 1
    cost: 1
    requires: []
    grants: [product.skilltree_audit=on, approval.session_audit=consume]

  - id: gov.content_policy
    tab: governance
    name_zh: Content Policy
    name_en: Content Policy
    rank: 1
    cost: 1
    requires: [gov.soul.base]
    grants: [product.content_policy=on]
  - id: gov.nsfw_gate
    tab: governance
    name_zh: NSFW Gate
    name_en: NSFW Gate
    rank: 2
    cost: 2
    requires: [gov.content_policy, gov.audit.1]
    grants: [product.nsfw_gate=user_enabled]
    default_enabled: false
    danger: high

  - id: gov.respec
    tab: governance
    name_zh: Respec（重配點）
    name_en: Respec
    rank: 1
    cost: 0
    requires: [gov.audit.1]
    grants: [product.respec=human_only]
  - id: gov.build_export
    tab: governance
    name_zh: Build Export
    name_en: Build Export
    rank: 1
    cost: 1
    requires: [gov.audit.1]
    grants: [product.export_policy_manifest=on]

  - id: gov.strict_path_mode
    tab: governance
    name_zh: Strict Path Mode
    name_en: Strict Path Mode
    rank: 1
    cost: 0
    requires: []
    grants: [product.strict_path_mode=on]
    default_enabled_by_platform:
      linux: false
      darwin: false
      win32: true
    danger: low
    note: "Agent cannot self-disable (Constitution). Human may turn off with audit."

deferred:
  - id: execution.gateway.fleet
    reason: "Fleet lifecycle deferred"
  - id: gov.soul.exp.3
    reason: "1600 char soul budget already at Brief soft cap"
  - id: gov.secret_vault
    reason: "Vault UI deferred; Persistent binds local secret store outside git"
